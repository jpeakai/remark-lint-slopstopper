<script id="record-data" type="application/json">{"SLOP-0001":{"file":"0001-vendor-the-generator-into-the-bundle.md","status":"accepted","title":"The bundle carries its own copy of the okf-yaml generator, schema and templates","markdown":"<!-- GENERATED from SLOP-0001 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe reference generator is a single Python file whose only dependencies uv can supply without a project\n\n#### We prefer\n\nvendoring the skill's generator unchanged into adrs/ and running it with uv run --no-project, over depending on a shared package or porting it to TypeScript\n\n#### Because\n\na clone of this repo then renders and gates its decisions with nothing outside it, while the copy stays provably the convention's\n\n#### Unless\n\nthe repo gains its own Python project, at which point the generator's dependencies move into it\n\n## Consequences\n\n### Pros\n\n- The bundle renders from this repo alone, with no package fetched from another repo.\n- The only local divergence is the id pattern in the schema, so an upstream fix arrives by copying.\n\n### Cons\n\n- The repo carries Python it does not maintain, in a style that is not its own.\n- The vendored copy drifts from the skill silently, because nothing checks the skill for changes.\n- Rendering needs uv and access to pypi.org on first run.\n"},"SLOP-0002":{"file":"0002-host-tree-is-the-document.md","status":"accepted","title":"Every policy reads the mdast tree the remark host already parsed","markdown":"<!-- GENERATED from SLOP-0002 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [SLOP-0012](0012-edits-splice-source-never-stringify.md) (an edit addresses source through the offsets the tree carries)\n- Depended on by [SLOP-0003](0003-shared-document-context-per-round.md) (the shared context wraps the one tree of the round)\n\n## Decision\n\n### The lens\n\n#### Given\n\nseveral policies need to know which bytes are prose and which are structure, and the remark host has already parsed the file\n\n#### We prefer\n\nreading the host's actual mdast tree through one DocumentContext, over each policy reparsing the source or scanning raw lines\n\n#### Because\n\nthe tree carries any edits earlier plugins made, and node types give every policy the same exemptions for code, tables and frontmatter\n\n#### Unless\n\na policy needs bytes the tree loses, such as original spacing or escapes.\nIt then reads the source through node offsets and the projection\n\n## Consequences\n\n### Pros\n\n- Exemptions are consistent across every policy, because they come from node types rather than heuristics.\n- A plugin earlier in the remark chain changes what every policy sees, with no second parse.\n\n### Cons\n\n- The package depends on the unified parser family and its tree types.\n- A policy must map tree positions back to source offsets before it can propose an edit.\n"},"SLOP-0003":{"file":"0003-shared-document-context-per-round.md","status":"accepted","title":"Whole-document data is derived once per round on a shared DocumentContext","markdown":"<!-- GENERATED from SLOP-0003 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0002](0002-host-tree-is-the-document.md) (the context wraps the host tree of the round)\n- Extended by [SLOP-0004](0004-lazy-language-view-on-nodes.md) (language analysis is the costliest data the context shares)\n- See also [SLOP-0010](0010-shared-code-groups-by-the-data-it-takes.md) (the context says what a rule is handed, and that record says where code reading it lives)\n\n## Decision\n\n### The lens\n\n#### Given\n\nseveral policies need data derived from the whole document or from the same node, such as projections, sentences or interpunct runs\n\n#### We prefer\n\nderiving that data at most once per reporting round on a DocumentContext every policy receives, over each policy computing what it needs\n\n#### Because\n\nshared data makes the agreement between policies structural, and a fix round starts from a fresh context so no stale result survives an edit\n\n#### Unless\n\nthe data is local to one policy, which keeps it inside that policy's module\n\n## Consequences\n\n### Pros\n\n- Three prose policies reading one paragraph share one projection and one sentence analysis.\n- A policy module reads as context in, diagnostics out.\n\n### Cons\n\n- Each fix round rebuilds the context, so derived data is recomputed after every applied edit.\n- Anything added to the context becomes a contract every policy and direct caller of createDocument can rely on.\n"},"SLOP-0004":{"file":"0004-lazy-language-view-on-nodes.md","status":"accepted","title":"Paragraph and text nodes carry a language view that analyses on first read","markdown":"<!-- GENERATED from SLOP-0004 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0003](0003-shared-document-context-per-round.md) (the view is the language data the context shares)\n- Depended on by [SLOP-0018](0018-sentence-budget-finding-estimates-clauses.md) (the clause count reads each sentence from the view)\n- Depended on by [SLOP-0019](0019-paragraph-budget-finding-suggests-breaks.md) (the break plan reads sentences and their terms from the view)\n- Extended by [SLOP-0005](0005-concepts-file-is-project-vocabulary.md) (the view tags project terms before it builds sentences)\n\n## Decision\n\n### The lens\n\n#### Given\n\nseveral policies, and plugins that run after this one, want the sentences, word counts and terms of a paragraph or a text node\n\n#### We prefer\n\na lazy view on each node whose sentences are one memoised Promise, over each rule running its own NLP pass or analysing every node eagerly\n\n#### Because\n\na node no rule asks about is never analysed, and every reader gets the same answer.\nSerialising or walking the tree never starts NLP by accident\n\n#### Unless\n\na rule needs language data across paragraphs, which calls for a document-level view and a new record\n\n## Consequences\n\n### Pros\n\n- A following remark plugin reads the same sentences from node.data.language with no import.\n- A Mermaid-only configuration never loads Compromise.\n\n### Cons\n\n- Every prose check is async because sentences arrive as a Promise, so the checks are awaited one after another.\n- Compromise's tags and sentence boundaries become part of what a reader relies on, so an upgrade can move findings.\n- A text view is a fragment, so its sentences end wherever inline markup starts.\n"},"SLOP-0005":{"file":"0005-concepts-file-is-project-vocabulary.md","status":"accepted","title":"A project's CONCEPTS.md supplies the term names the language view tags as nouns","markdown":"<!-- GENERATED from SLOP-0005 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0004](0004-lazy-language-view-on-nodes.md) (the view tags project terms before it builds sentences)\n\n## Decision\n\n### The lens\n\n#### Given\n\na project keeps its domain terms as headings in a CONCEPTS.md, and Compromise misreads many of them as verbs or adjectives\n\n#### We prefer\n\nreading that file's heading names as a per-context noun vocabulary, over a vocabulary option in the remark config\n\n#### Because\n\nthe file is already where the project names its terms, so a second copy in configuration would drift from it\n\n#### Unless\n\na project needs concepts from several files or from an ancestor directory, which calls for an option and a new record\n\n## Consequences\n\n### Pros\n\n- Domain phrases no longer distort clause counts, content terms or cohesion cues.\n- A missing file is an empty vocabulary, so a project without one runs unchanged.\n- No process-global NLP state changes, so contexts never leak terms into each other.\n\n### Cons\n\n- Only the working directory is inspected, so linting from another directory silently drops the vocabulary.\n- Aliases, tables and list-only glossaries are not extracted, so each term needs its own heading.\n- Findings depend on a file other than the one checked, so editing CONCEPTS.md can move them.\n"},"SLOP-0006":{"file":"0006-configuration-is-remark-plugin-options.md","status":"accepted","title":"Configuration is remark plugin options, and a disabled policy never runs","markdown":"<!-- GENERATED from SLOP-0006 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0039](0039-plain-word-runs-and-min-items.md) (minItems is set like any other rule option)\n- Depends on [SLOP-0008](0008-rule-id-is-subsystem-category-and-short-name.md) (a per-rule setting is keyed by the short name after the slash)\n\n## Decision\n\n### The lens\n\n#### Given\n\na project wants to disable a policy, tune its budget or enable fixes, and already configures remark\n\n#### We prefer\n\nplugin options in the host's remark config, over a config file and loader of the package's own.\nShared options are overridden per rule, and severity is limited to error or off\n\n#### Because\n\nthe host already finds, loads and merges configuration, and one more file would duplicate that and drift from it\n\n#### Unless\n\na setting must be shared by tools that are not remark hosts, which calls for a new record\n\n## Consequences\n\n### Pros\n\n- Configuration lives where every other remark plugin's does, including remark-cli's rc files.\n- A disabled policy is never evaluated, so a prose-only setup never loads Mermaid.\n\n### Cons\n\n- An unknown short name in a JavaScript config is silently ignored, because only TypeScript checks the keys.\n- An invalid budget fails only when its policy first runs, not when the config loads.\n- Every enabled policy is an error, so a team cannot downgrade one to a warning.\n"},"SLOP-0007":{"file":"0007-a-finding-fails-or-the-policy-is-off.md","status":"accepted","title":"A custom policy's finding is a fatal error, or the policy is off","markdown":"<!-- GENERATED from SLOP-0007 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depended on by [SLOP-0028](0028-unmodelled-styling-is-an-error-never-a-guess.md) (an unauditable surface is a failing finding, not an advisory note)\n\n## Decision\n\n### The lens\n\n#### Given\n\na check is uncertain enough that failing on it seems harsh, or a diagram cannot be parsed so no policy can evaluate it\n\n#### We prefer\n\na fatal VFile error for every finding of an enabled custom policy, over a warning level or an advisory that does not fail.\nA parse failure is reported as an error attributed to the selected Mermaid policy\n\n#### Because\n\na run that exits 0 should have nothing to report, and a diagram nobody could evaluate has not passed\n\n#### Unless\n\nthe policy is switched off, which also skips its parse checks\n\n## Consequences\n\n### Pros\n\n- The exit code and the reported findings always agree.\n- A broken diagram never passes a contrast or complexity gate by being unreadable.\n\n### Cons\n\n- A borderline heuristic must be fixed, removed or switched off rather than softened.\n- A parse failure is reported once per enabled Mermaid policy rather than as its own configurable rule.\n"},"SLOP-0008":{"file":"0008-rule-id-is-subsystem-category-and-short-name.md","status":"accepted","title":"A policy identifier is its subsystem, then a category word and a short name","markdown":"<!-- GENERATED from SLOP-0008 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0009](0009-one-module-per-rule.md) (a policy file is named by the short name after the slash)\n- Depended on by [SLOP-0006](0006-configuration-is-remark-plugin-options.md) (configuration names a policy by its short name)\n\n## Decision\n\n### The lens\n\n#### Given\n\nevery finding, configuration key, suppression comment, heading and test names a policy\n\n#### We prefer\n\nan identifier of the subsystem, a slash, one category word and a short name joined by hyphens, over a sequential number\n\n#### Because\n\nthe identifier then says which subsystem owns the policy and what it guards before anyone looks it up\n\n#### Unless\n\na new policy fits no existing category, which calls for a new category word rather than a catch-all\n\n## Consequences\n\n### Pros\n\n- A finding line explains itself.\n- Short names sort by category in a directory listing and in RULES.md.\n\n### Cons\n\n- Identifiers are long in messages, tables and suppression comments.\n- Short names must stay unique across subsystems, because configuration drops the subsystem.\n"},"SLOP-0009":{"file":"0009-one-module-per-rule.md","status":"accepted","title":"Each policy lives in its own module named by its short name","markdown":"<!-- GENERATED from SLOP-0009 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [SLOP-0008](0008-rule-id-is-subsystem-category-and-short-name.md) (the short name a file is named by starts with the policy's category)\n- Depended on by [SLOP-0010](0010-shared-code-groups-by-the-data-it-takes.md) (a helper leaves its policy module only once a second policy needs it)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe package holds independent policies, and some gain a fixer\n\n#### We prefer\n\none module per policy, over grouping policies by theme in larger files.\nEach module is named by the policy's short name and holds its check and any edit it proposes.\nShared machinery lives in src/document\n\n#### Because\n\nthe identifier is how findings, configuration, suppression comments and tests name a policy, so the file tree mirrors it\n\n#### Unless\n\ntwo policies share a detector, in which case the detector moves to its own module\n\n## Consequences\n\n### Pros\n\n- A policy and its tests can be read without the rest of the package.\n\n### Cons\n\n- Adding a policy touches three places, the type union, the registry and the orchestrator.\n- Which policies may fix lives in the adapter and the registry, away from the policies themselves.\n"},"SLOP-0010":{"file":"0010-shared-code-groups-by-the-data-it-takes.md","status":"accepted","title":"Shared code sits in the layer whose data it takes, and layers import downwards","markdown":"<!-- GENERATED from SLOP-0010 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0009](0009-one-module-per-rule.md) (a helper leaves its policy module only once a second policy needs it)\n- See also [SLOP-0003](0003-shared-document-context-per-round.md) (the context says what a policy is handed, and this says where code reading it lives)\n- Depended on by [SLOP-0011](0011-code-complexity-is-gated-by-biome.md) (a function split for the complexity limits places its helpers by this rule)\n\n## Decision\n\n### The lens\n\n#### Given\n\nshared code has to live somewhere a reader can predict\n\n#### We prefer\n\nplacing a function in the layer whose data it takes, over grouping helpers by which policy calls them.\nImports flow from policies down to the document layer\n\n#### Because\n\nthe arguments are visible in the signature while the callers are not.\nA downward import graph keeps the document model reusable by plugins and direct callers\n\n#### Unless\n\na derivation has its own vocabulary, which earns it a named module of its own\n\n## Consequences\n\n### Pros\n\n- remark-lint-slopstopper/document and /language-view export a layer that carries no policy.\n- A module's placement is checkable from the signatures inside it.\n\n### Cons\n\n- Sharing a helper costs an import edge where duplication cost none.\n- A policy-specific derivation, such as paragraph planning, sits beside its policy rather than with the language model it extends.\n"},"SLOP-0011":{"file":"0011-code-complexity-is-gated-by-biome.md","status":"accepted","title":"Code complexity is gated by Biome rules that fail the build","markdown":"<!-- GENERATED from SLOP-0011 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0010](0010-shared-code-groups-by-the-data-it-takes.md) (a long function splits into helpers that sit in the layer whose data they read)\n\n## Decision\n\n### The lens\n\n#### Given\n\nevery function in the package is linted by bun run check\n\n#### We prefer\n\nBiome complexity rules at error level, over warnings or a separate complexity tool\n\n#### Because\n\nBiome already gates the build, and an error is the only level this repo keeps\n\n#### Unless\n\na rule produces findings that no refactor can fix without hiding the logic, which calls for a new record\n\n## Consequences\n\n### Pros\n\n- A long fixer is split into steps a reviewer can check one at a time.\n- The limits live in the one linter the repo already runs, with no new dependency.\n\n### Cons\n\n- Extracting helpers adds functions and names to the larger modules.\n- The limits are numbers, so a function near one may be split where a human would not.\n"},"SLOP-0012":{"file":"0012-edits-splice-source-never-stringify.md","status":"accepted","title":"Fixes splice source ranges and the adapter never stringifies the tree","markdown":"<!-- GENERATED from SLOP-0012 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0002](0002-host-tree-is-the-document.md) (ranges are addressed through the offsets the parsed tree supplies)\n- Depended on by [SLOP-0014](0014-every-edit-is-verified-before-it-is-exposed.md) (one spliced range is cheap to verify)\n\n## Decision\n\n### The lens\n\n#### Given\n\na policy wants to change a small part of a document inside a remark host whose default output path stringifies the tree\n\n#### We prefer\n\nsplicing replacement text built from source slices into the original string and compiling that string, over editing the tree and serialising it with remark-stringify\n\n#### Because\n\nevery byte outside an edit is preserved by construction, so the diff is exactly the fix and the package coexists with any formatter\n\n#### Unless\n\nno source slice can express the change, in which case the policy offers no edit rather than generating markup\n\n## Consequences\n\n### Pros\n\n- Fix diffs are minimal and reviewable.\n- Mermaid fences and unrelated Markdown are never rewritten by a generic serializer.\n\n### Cons\n\n- Each fixer reasons about offsets, escapes, indentation and line endings itself.\n- Overlapping edits cannot combine in one round and wait for the reparse.\n- Replacing the compiler in fix mode overrides any serializer the host configured.\n"},"SLOP-0013":{"file":"0013-a-fixer-refuses-when-unsure.md","status":"accepted","title":"A fixer offers no edit whenever the input is ambiguous","markdown":"<!-- GENERATED from SLOP-0013 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [SLOP-0014](0014-every-edit-is-verified-before-it-is-exposed.md) (verification withdraws an edit on behalf of a fixer that did not refuse)\n- Tested by [SLOP-0016](0016-fix-behaviour-is-tested-on-real-inputs.md) (each refusal is pinned by a test whose output equals its input)\n- Depended on by [SLOP-0020](0020-em-dash-becomes-parentheses-or-colon.md) (the em-dash fixer refuses every shape outside two)\n- Depended on by [SLOP-0021](0021-comma-run-of-code-spans-is-a-hidden-list.md) (the fixer refuses a run mid-sentence, without a lead-in, or opening inside markup)\n\n## Decision\n\n### The lens\n\n#### Given\n\na fixer cannot be sure its rewrite keeps the author's meaning\n\n#### We prefer\n\nreporting the finding without an edit, over applying the most likely rewrite\n\n#### Because\n\nthe finding still fails the run, so a human sees the case, while a wrong fix hides it permanently\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- An applied fix can be trusted without reading the diff line by line.\n\n### Cons\n\n- Some fixable prose stays reported until a human edits it.\n- Each fixer carries a list of refusal conditions that grows with every hostile case found.\n"},"SLOP-0014":{"file":"0014-every-edit-is-verified-before-it-is-exposed.md","status":"accepted","title":"Every edit is reparsed and compared with the original before a finding may carry it","markdown":"<!-- GENERATED from SLOP-0014 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0012](0012-edits-splice-source-never-stringify.md) (verification is cheap because an edit is a single spliced range)\n- Extends [SLOP-0013](0013-a-fixer-refuses-when-unsure.md) (verification withdraws an edit on behalf of a fixer that did not refuse)\n- Tested by [SLOP-0016](0016-fix-behaviour-is-tested-on-real-inputs.md) (tests assert the words, structure and surrounding bytes an edit must keep)\n- Depended on by [SLOP-0017](0017-budget-findings-are-never-autofixed.md) (shortening text changes the words verification protects)\n- Extended by [SLOP-0015](0015-every-edit-rides-on-a-visible-finding.md) (a verified edit is applied only through a finding that is still visible)\n\n## Decision\n\n### The lens\n\n#### Given\n\na fixer has proposed an edit and a finding is about to carry it to the adapter\n\n#### We prefer\n\nreparsing the edited source and comparing its structure and visible words with the original, alone and as a batch, over trusting the fixer's own logic\n\n#### Because\n\na change the fixer did not declare is either a fixer bug or a case it did not foresee, and neither may reach the file\n\n#### Unless\n\nnever; a fixer whose change alters punctuation or structure on purpose declares the exact change it expects, and anything beyond it is withdrawn\n\n## Consequences\n\n### Pros\n\n- A fixer bug shows up as a finding left without an edit, never as a silent content change.\n- Two edits that are each safe but unsafe together never land in one round.\n  The first is kept and the rest wait for the next.\n\n### Cons\n\n- Every candidate edit costs a reparse of the whole document.\n- A withdrawn edit is silent, so a fixer bug reads as a refusal unless a test expects the fix.\n- A fixer that changes punctuation or structure must state its expected change, which the whitespace-only comparison alone cannot express.\n"},"SLOP-0015":{"file":"0015-every-edit-rides-on-a-visible-finding.md","status":"accepted","title":"An edit is applied only through a visible finding of a fixable policy","markdown":"<!-- GENERATED from SLOP-0015 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0014](0014-every-edit-is-verified-before-it-is-exposed.md) (beyond a verified edit, no edit touches a passage the check passed)\n- See also [SLOP-0021](0021-comma-run-of-code-spans-is-a-hidden-list.md) (that check reports runs its fixer refuses, the other half of keeping check and fix in step)\n\n## Decision\n\n### The lens\n\n#### Given\n\na check decides what fails and a fixer decides what to rewrite, and native lint comments can hide a finding\n\n#### We prefer\n\ncarrying each edit on the diagnostic its check reports, over a separate fix pass that finds its own targets.\nOnly the edits of visible findings are applied\n\n#### Because\n\na file that passes the check is then a fixed point of fix mode, and suppressing a finding also suppresses its edit\n\n#### Unless\n\na fixer refuses a case the check reports, such as a hard break or a blockquote, which leaves the finding for a human\n\n## Consequences\n\n### Pros\n\n- A passing file is never rewritten by fix mode.\n- Agents that pack sentences onto one line get a finding, not a silent pass.\n\n### Cons\n\n- The check inherits every sentence-boundary misreading of Compromise, so a wrong boundary is both reported and rewritten.\n- A policy gains automatic edits only by an explicit adapter change, because returning a fix alone is ignored.\n"},"SLOP-0016":{"file":"0016-fix-behaviour-is-tested-on-real-inputs.md","status":"accepted","title":"Fix behaviour is proven by real-input tests of edits, refusals and stability","markdown":"<!-- GENERATED from SLOP-0016 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Tests [SLOP-0013](0013-a-fixer-refuses-when-unsure.md) (each refusal is pinned by a test whose output equals its input)\n- Tests [SLOP-0014](0014-every-edit-is-verified-before-it-is-exposed.md) (tests assert the words, structure and surrounding bytes an edit must keep)\n\n## Decision\n\n### The lens\n\n#### Given\n\na change touches how any policy fixes prose\n\n#### We prefer\n\ntests that run the real remark processor on real and hostile inputs, over example tests of the happy path alone.\nThey assert the targeted edit, the untouched bytes, each refusal, the recheck and a second run that changes nothing\n\n#### Because\n\na fixer's worst bug is a meaning change on input nobody wrote a fixture for, and each hostile case found becomes a named test\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A regression in a fixer fails a named test before it reaches a document.\n- Tests exercise remark, the adapter and suppression together, as a consumer runs them.\n\n### Cons\n\n- Running a real processor makes the suite slower than unit tests of the fix function alone.\n- Hostile inputs are only as good as the cases someone thinks of, since no generated inputs explore the rest.\n"},"SLOP-0017":{"file":"0017-budget-findings-are-never-autofixed.md","status":"accepted","title":"Sentence and paragraph budget findings are reported and never autofixed","markdown":"<!-- GENERATED from SLOP-0017 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0014](0014-every-edit-is-verified-before-it-is-exposed.md) (verification forbids the word changes a length fix would need)\n- Extended by [SLOP-0018](0018-sentence-budget-finding-estimates-clauses.md) (the sentence finding estimates clauses to guide a split)\n- Extended by [SLOP-0019](0019-paragraph-budget-finding-suggests-breaks.md) (the paragraph finding suggests where to break)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sentence exceeds its word budget or a paragraph exceeds its sentence budget\n\n#### We prefer\n\nreporting the finding with guidance for a human or an agent to rewrite, over any mechanical split, trim or paragraph break\n\n#### Because\n\nevery shortening changes words and every break decides which sentences belong together, and both are choices about meaning\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- Fix mode never rewrites meaning.\n\n### Cons\n\n- A fix run can finish with findings left, so the run still fails until someone edits.\n- The quality of the rewrite depends entirely on how well the finding's message guides it.\n"},"SLOP-0018":{"file":"0018-sentence-budget-finding-estimates-clauses.md","status":"accepted","title":"A sentence budget finding estimates clauses to guide a split","markdown":"<!-- GENERATED from SLOP-0018 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0017](0017-budget-findings-are-never-autofixed.md) (the rule stays report-only, and its message carries the guidance a rewrite needs)\n- Depends on [SLOP-0004](0004-lazy-language-view-on-nodes.md) (the rule reads each sentence and its clause count from the language view)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sentence exceeds the word budget and a human or an agent must rewrite it\n\n#### We prefer\n\nreporting potential clauses and a target sentence count, over reporting the word count alone.\nPotential clauses are the larger of the marker count and the verbs Compromise finds\n\n#### Because\n\na clause count names where the sentence can split, which steers a rewrite towards splitting rather than compressing into fragments\n\n#### Unless\n\na deterministic dependency parser that runs in JavaScript replaces both signals, which would supersede the counting method only\n\n## Consequences\n\n### Pros\n\n- Rewrites keep their connective words and read as prose.\n- A series of verbs asks for a split per verb even with no marker word.\n- The message stays deterministic, with no model call.\n\n### Cons\n\n- Compromise misses some verbs, so a clause joined with no marker can go uncounted.\n- A comma before and in a list reads as a clause boundary, so lists overcount.\n"},"SLOP-0019":{"file":"0019-paragraph-budget-finding-suggests-breaks.md","status":"accepted","title":"A paragraph budget finding suggests breaks from lexical cohesion","markdown":"<!-- GENERATED from SLOP-0019 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0017](0017-budget-findings-are-never-autofixed.md) (like a long sentence, a long paragraph is reported and never moved by a fixer)\n- Depends on [SLOP-0004](0004-lazy-language-view-on-nodes.md) (the plan reads sentences and their terms from the paragraph's view)\n\n## Decision\n\n### The lens\n\n#### Given\n\na running-prose paragraph holds more sentences than the budget, which defaults to five\n\n#### We prefer\n\na finding that names lexical topic groups and the sentences to break after, over a bare sentence count\n\n#### Because\n\nthe cues show where the paragraph wants to break, so a rewrite separates topics instead of deleting sentences\n\n#### Unless\n\na JavaScript topic segmenter proves better at finding turns, which would supersede the cohesion scoring only\n\n## Consequences\n\n### Pros\n\n- A finding tells a human or an agent where to break, not only that the paragraph is long.\n- The guidance is deterministic, with no model call.\n\n### Cons\n\n- Cohesion by shared lemmas misses synonyms, so a topic held together by paraphrase can read as two.\n- Compromise's sentence splitting sets the count, so a quoted sentence or an abbreviation can shift it by one.\n"},"SLOP-0020":{"file":"0020-em-dash-becomes-parentheses-or-colon.md","status":"accepted","title":"An em-dash pair becomes parentheses and a lone em-dash becomes a colon","markdown":"<!-- GENERATED from SLOP-0020 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0013](0013-a-fixer-refuses-when-unsure.md) (every pattern outside the two shapes is reported without an edit)\n\n## Decision\n\n### The lens\n\n#### Given\n\na sentence in running prose contains an em-dash\n\n#### We prefer\n\nreplacing a pair around an aside with parentheses and a single dash with a colon, over reporting every dash for a manual rewrite\n\n#### Because\n\nthose two shapes have one reading each, so the replacement keeps the meaning\n\n#### Unless\n\nthe dash touches punctuation, sits between digits, shares a sentence with a colon, or brackets an aside that looks like an enumeration marker\n\n## Consequences\n\n### Pros\n\n- The most common glyph finding clears without a human.\n- Code is exempt by construction, because only text nodes are read.\n\n### Cons\n\n- The rule carries a growing list of refusal conditions.\n- The edit changes punctuation, so verification must accept the declared swap rather than demand identical text.\n"},"SLOP-0021":{"file":"0021-comma-run-of-code-spans-is-a-hidden-list.md","status":"accepted","title":"A comma-joined run of three or more inline code spans is a hidden list","markdown":"<!-- GENERATED from SLOP-0021 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [SLOP-0039](0039-plain-word-runs-and-min-items.md) (plain-word series get their own rule, and minItems tunes this rule's threshold)\n- Depends on [SLOP-0013](0013-a-fixer-refuses-when-unsure.md) (a run mid-sentence, without a lead-in, or opening inside a link or emphasis gets no edit)\n- See also [SLOP-0015](0015-every-edit-rides-on-a-visible-finding.md) (the check reports runs the fix refuses, so a refused run stays reported rather than silently passing)\n\n## Decision\n\n### The lens\n\n#### Given\n\ncomma-joined items that are each only an inline code span, with an optional and or or before the last\n\n#### We prefer\n\na list rule whose items are only code spans, from three items by default, over one rule that counts any comma series of plain words\n\n#### Because\n\na series of bare code spans, such as file names, flags or keys, is almost always a real list.\nA short series of plain words is ordinary English\n\n#### Unless\n\na plain-word list can be told from a series by its words alone, which calls for its own rule with a stricter threshold\n\n## Consequences\n\n### Pros\n\n- A run of file names, flags or keys becomes a list a reader can scan.\n- A code span followed by content is no bare item, so labelled runs stay with their own rule.\n\n### Cons\n\n- A bare list of plain words, such as service names without backticks, passes this rule.\n- A run mid-sentence is reported with no fix, so the author rewrites it by hand.\n- Promotion changes block structure, so verification must accept the declared list shape.\n"},"SLOP-0022":{"file":"0022-diagrams-are-measured-by-mermaids-own-parsers.md","status":"accepted","title":"Every diagram is read through Mermaid's own parsers, never by scanning its text","markdown":"<!-- GENERATED from SLOP-0022 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Excepted by [SLOP-0024](0024-gaps-in-mermaids-parsers-get-the-narrowest-workaround.md) (the few places Mermaid exposes nothing, each with one narrow workaround)\n- See also [SLOP-0023](0023-a-diagram-is-a-mermaid-code-node-of-the-host-tree.md) (the fence a diagram comes from is read from the host tree)\n- Depended on by [SLOP-0032](0032-a-split-plan-is-verified-independently-and-by-reparse.md) (emitted sources are checked by parsing them again with the same parsers)\n\n## Decision\n\n### The lens\n\n#### Given\n\na Mermaid policy needs what a diagram says.\nThat covers its structure of nodes, edges, rows and regions.\nIt also covers shapes, labels and style declarations\n\n#### We prefer\n\nreading them from the result of Mermaid core and @mermaid-js/parser, over a regular expression, tokeniser or hand-written parser over the diagram text\n\n#### Because\n\nthe official parsers implement the grammar the renderer draws, so a second reading can only drift from what a reader sees.\nIt would also double the code to test\n\n#### Unless\n\nthe parser rejects the diagram, which then becomes a positioned mermaid/parse-diagram-unparseable error attributed to the selected policy, never a guessed reading\n\n## Consequences\n\n### Pros\n\n- Counts, colours and split plans describe the diagram Mermaid draws.\n- A Mermaid release that changes the grammar changes this package's reading with it.\n\n### Cons\n\n- The package depends on mermaid, its parser and a Happy DOM shim that must be repaired before Mermaid loads.\n- Some parser results are internal shapes, so a Mermaid upgrade can break an adapter and only the tests catch it.\n- Mermaid's parser and theme state are mutable singletons, so every diagram is analysed in one serial queue.\n"},"SLOP-0023":{"file":"0023-a-diagram-is-a-mermaid-code-node-of-the-host-tree.md","status":"accepted","title":"A diagram is a mermaid code node of the host's tree, mapped back to the source by line","markdown":"<!-- GENERATED from SLOP-0023 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0022](0022-diagrams-are-measured-by-mermaids-own-parsers.md) (the fence's text is then read only through Mermaid's parsers)\n\n## Decision\n\n### The lens\n\n#### Given\n\na Mermaid policy needs the diagrams of a document and a position for each finding\n\n#### We prefer\n\ntaking every code node whose language is mermaid from the host's actual mdast tree, over scanning the Markdown for fence lines.\nA diagram-relative line maps back to the Markdown source\n\n#### Because\n\nthe tree gives exactly the fences the renderer draws, including ones inside lists and quotes.\nIt never mistakes Markdown-looking text inside another code block for a diagram\n\n#### Unless\n\nthe parser omits a fence's position, which throws rather than reporting at a guessed offset\n\n## Consequences\n\n### Pros\n\n- Every diagram a GFM renderer would draw is checked, and nothing else is.\n- A finding points at the line inside the fence, in the file the host is linting.\n\n### Cons\n\n- A fence tagged mermaid with extra info-string words is still read as a diagram.\n- A finding inside a fence can only be placed as precisely as Mermaid's own line numbers allow.\n"},"SLOP-0024":{"file":"0024-gaps-in-mermaids-parsers-get-the-narrowest-workaround.md","status":"accepted","title":"Where Mermaid exposes nothing, the narrowest workaround is used and refuses when it would guess","markdown":"<!-- GENERATED from SLOP-0024 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Scoped exception to [SLOP-0022](0022-diagrams-are-measured-by-mermaids-own-parsers.md) (the only places the package does not take a fact straight from Mermaid's result)\n\n## Decision\n\n### The lens\n\n#### Given\n\na feature needs something Mermaid does not expose.\nExamples are a map from Mermaid's preprocessed text back to the diagram source, a detector for zenuml, or Mermaid's reading of a style declaration\n\n#### We prefer\n\none workaround per gap, as small as the gap, over a custom parser or a text match that picks a best guess.\nA workaround places a value only when one reading is possible, and otherwise refuses\n\n#### Because\n\neach workaround stays reviewable at the size of its gap, and a refusal keeps a finding from pointing at frontmatter or a line Mermaid dropped\n\n#### Unless\n\nMermaid exposes the missing piece, when the workaround is deleted and Mermaid is called instead\n\n## Consequences\n\n### Pros\n\n- Every place the package does not read Mermaid's result directly can be listed and reviewed.\n- A position that could be wrong is never reported as certain.\n\n### Cons\n\n- Some declarations are never placed in the source, so their findings point at the fence rather than the line.\n- The declaration reader and entity placeholders mirror Mermaid internals that an upgrade can change without a type error.\n"},"SLOP-0025":{"file":"0025-colour-and-contrast-come-from-colorjs.md","status":"accepted","title":"Colour parsing, compositing and WCAG contrast come only from colorjs.io","markdown":"<!-- GENERATED from SLOP-0025 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0026](0026-theme-colours-come-from-mermaids-theme-engine.md) (Mermaid resolves the colours, and colorjs.io scores them)\n\n## Decision\n\n### The lens\n\n#### Given\n\nthe contrast policy must read a colour, composite a translucent fill over its backdrop and score text against 4.5 to 1\n\n#### We prefer\n\ncalling colorjs.io for parsing, gamut clipping, compositing and the WCAG 2.1 ratio, over writing our own colour parser, luminance formula or ratio\n\n#### Because\n\ncolorjs.io reads every CSS Color Level 4 syntax and implements the published WCAG 2.1 algorithm.\nA copy of that maths can only drift from it\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A reported ratio matches the WCAG 2.1 definition for every colour syntax a browser reads.\n- All colour maths lives in one small module.\n\n### Cons\n\n- Any change to a contrast algorithm waits on colorjs.io's release cadence.\n- The contrast policy carries a dependency the prose policies never load.\n"},"SLOP-0026":{"file":"0026-theme-colours-come-from-mermaids-theme-engine.md","status":"accepted","title":"Theme colours come from Mermaid's own theme engine on a pinned Mermaid version","markdown":"<!-- GENERATED from SLOP-0026 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0025](0025-colour-and-contrast-come-from-colorjs.md) (Mermaid resolves the colours, and colorjs.io scores them)\n- See also [SLOP-0027](0027-the-page-canvas-is-a-rule-option-that-defaults-to-github.md) (page-backed surfaces are scored on the canvas)\n- Depended on by [SLOP-0028](0028-unmodelled-styling-is-an-error-never-a-guess.md) (what the theme engine cannot resolve is reported, not assumed)\n\n## Decision\n\n### The lens\n\n#### Given\n\nmany diagram colours are theme variables Mermaid derives from each other and from frontmatter or init configuration.\nSo is every colour of a sequence diagram without style directives\n\n#### We prefer\n\nresolving the light and dark themes with Mermaid's own theme engine, over copying Mermaid's palettes into the package.\nThe engine runs on an exactly pinned mermaid, inside a transaction that restores its configuration\n\n#### Because\n\nderived colours change between Mermaid releases, and a copy drifts silently while a pin changes only in a reviewed bump\n\n#### Unless\n\nthe diagram sets its own theme, which Mermaid then applies to both viewer themes\n\n## Consequences\n\n### Pros\n\n- A diagram that passes reads in both themes on the pinned Mermaid.\n- Frontmatter and init directives merge the way the renderer merges them.\n\n### Cons\n\n- A host rendering with another Mermaid version may derive other colours than the ones scored.\n- Mermaid's configuration is a global, so each resolution runs serially and must restore it.\n"},"SLOP-0027":{"file":"0027-the-page-canvas-is-a-rule-option-that-defaults-to-github.md","status":"accepted","title":"The page canvas is a contrast rule option that defaults to GitHub's light and dark pages","markdown":"<!-- GENERATED from SLOP-0027 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0026](0026-theme-colours-come-from-mermaids-theme-engine.md) (page-backed surfaces are scored on the canvas)\n- See also [SLOP-0028](0028-unmodelled-styling-is-an-error-never-a-guess.md) (a canvas that cannot be read is a usage error, as unmodelled styling is a finding)\n\n## Decision\n\n### The lens\n\n#### Given\n\ntranslucent fills, edge label backgrounds, diagram titles and page-backed sequence elements are read against the page.\nA host other than GitHub draws its own page\n\n#### We prefer\n\na canvas of opaque light and dark colours set through the mermaid/contrast-text-below-aa rule options, defaulting to GitHub's white and\n\n#### Because\n\nthe page is the one rendering assumption a host may change, and one option covers every page-backed surface without modelling each host's theme\n\n#### Unless\n\na canvas colour is not a CSS colour or is translucent, which throws a TypeError before any diagram is scored.\nA canvas that cannot be read would report passes it never affected\n\n## Consequences\n\n### Pros\n\n- A host with its own page colours scores diagrams as its readers see them.\n- A configuration that sets no canvas scores exactly what GitHub shows.\n\n### Cons\n\n- The canvas models the page only, so a host that also restyles Mermaid's own surfaces with CSS is not modelled.\n- One configuration holds one canvas, so documents rendered on different pages need separate remark configurations.\n"},"SLOP-0028":{"file":"0028-unmodelled-styling-is-an-error-never-a-guess.md","status":"accepted","title":"Styling the contrast audit cannot model is reported as an error, never scored by a guess","markdown":"<!-- GENERATED from SLOP-0028 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Depends on [SLOP-0026](0026-theme-colours-come-from-mermaids-theme-engine.md) (what the theme engine cannot resolve is reported, not assumed)\n- See also [SLOP-0027](0027-the-page-canvas-is-a-rule-option-that-defaults-to-github.md) (a canvas that cannot be read is a usage error, as unmodelled styling is a finding)\n- Depends on [SLOP-0007](0007-a-finding-fails-or-the-policy-is-off.md) (an unauditable surface is a failing finding, not an advisory note)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram uses styling whose rendered text colour or background the audit cannot derive.\nExamples are custom themeCSS, an unsupported rendering mode or a surface with no model\n\n#### We prefer\n\nreporting a mermaid/contrast-text-below-aa error that names the selector and the reason, over skipping the surface or scoring an assumed colour\n\n#### Because\n\na skipped or guessed surface reads as a pass the audit never earned.\nThe reader who cannot see the text is the one the rule exists for\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- A clean contrast run means every text surface was actually scored in both themes.\n- The message tells the author which styling to replace with supported Mermaid colours.\n\n### Cons\n\n- A diagram whose custom CSS is readable still fails until the CSS is replaced or the rule is suppressed.\n- Each newly supported diagram family needs a surface model before its styled diagrams can pass.\n"},"SLOP-0029":{"file":"0029-thresholds-are-rule-options-not-environment.md","status":"accepted","title":"Complexity thresholds are remark rule options, never environment variables","markdown":"<!-- GENERATED from SLOP-0029 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0030](0030-the-score-counts-what-a-reader-must-read.md) (the thresholds are compared against this score)\n\n## Decision\n\n### The lens\n\n#### Given\n\na project needs different density limits for its diagrams\n\n#### We prefer\n\nsetting a preset such as low-density or numeric threshold overrides in the remark plugin options, over environment variables\n\n#### Because\n\nthe remark configuration is committed and reviewed, so a verdict is a function of the repository and its configuration alone\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- The same commit gives the same verdict on every machine and in CI.\n- Overriding any threshold marks the preset as custom in the message, so the reader knows the limits moved.\n\n### Cons\n\n- A one-off stricter run needs another remark configuration file, passed with --rc-path.\n"},"SLOP-0030":{"file":"0030-the-score-counts-what-a-reader-must-read.md","status":"accepted","title":"The visual complexity score counts what a reader must read, not every record the parser keeps","markdown":"<!-- GENERATED from SLOP-0030 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0029](0029-thresholds-are-rule-options-not-environment.md) (the thresholds are compared against this score)\n- See also [SLOP-0035](0035-a-plan-makes-the-fewest-folds-and-says-why-it-was-flagged.md) (a plan's overview and details are measured by this score)\n\n## Decision\n\n### The lens\n\n#### Given\n\na parser's result holds records with nothing to read, such as a start marker or a block's closing line.\nIt also files some things a reader does read, such as attributes, outside its nodes\n\n#### We prefer\n\ncounting nodes, edges, boxes, blocks and rows, over counting every record the parser keeps.\nA row weighs a quarter of a node and an edge half, and markers, notes and control lines are left out\n\n#### Because\n\nthe score stands for what a reader must find, trace and hold.\nA record with nothing to read inflates it, and a missed row or boundary deflates it\n\n#### Unless\n\na family draws a record the reader must place, as a fork or a choice is, which stays a node\n\n## Consequences\n\n### Pros\n\n- A sequence diagram with notes and activations scores its messages, not every statement.\n- A large entity or class scores higher than an empty one.\n\n### Cons\n\n- The row and edge weights are judgements, not measured values.\n- Each family needs its own adapter decision about what a reader reads.\n"},"SLOP-0031":{"file":"0031-mermaid-policies-report-and-never-edit-a-diagram.md","status":"accepted","title":"Mermaid policies report findings with guidance and never edit a diagram","markdown":"<!-- GENERATED from SLOP-0031 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extended by [SLOP-0032](0032-a-split-plan-is-verified-independently-and-by-reparse.md) (the plan a finding carries is checked before it is offered, and still never applied)\n- Extended by [SLOP-0034](0034-a-refused-plan-offers-the-list-or-matrix-that-reads-better.md) (where no plan fits, the finding carries a list or matrix instead)\n\n## Decision\n\n### The lens\n\n#### Given\n\na diagram fails contrast or exceeds its acceptable visual complexity score, and many repairs would clear the finding\n\n#### We prefer\n\nreporting the finding with concrete guidance, over rewriting the fence, even under fix true.\nGuidance includes the measured ratio or a verified overview and detail sources\n\n#### Because\n\na replacement colour is a palette choice and a split boundary is a design decision.\nBoth change what the diagram says, so only the author can make them\n\n#### Unless\n\nnever\n\n## Consequences\n\n### Pros\n\n- Running with fix true can never change what a diagram means.\n- A complexity finding still names where to cut, not only how small to cut.\n\n### Cons\n\n- Every Mermaid finding needs a human to resolve it, even when black or white text would clearly pass.\n- A split plan inside a diagnostic message makes that message long.\n"},"SLOP-0032":{"file":"0032-a-split-plan-is-verified-independently-and-by-reparse.md","status":"accepted","title":"A split plan is offered only after an independent contract and a reparse of every emitted source","markdown":"<!-- GENERATED from SLOP-0032 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0031](0031-mermaid-policies-report-and-never-edit-a-diagram.md) (the plan a finding carries is checked before it is offered, and still never applied)\n- Depends on [SLOP-0022](0022-diagrams-are-measured-by-mermaids-own-parsers.md) (emitted sources are checked by parsing them again with the same parsers)\n- Tests [SLOP-0033](0033-a-split-plan-follows-the-authors-structure.md) (the contract refuses a plan that moves a marker, hides a region or merges an edge)\n- Tests [SLOP-0037](0037-a-group-is-named-by-what-it-holds.md) (every group label is accepted only as recomputed from its members)\n- Tests [SLOP-0038](0038-a-stub-names-exactly-one-thing-and-draws-each-edge-once.md) (stub texts must have one reading, and half edges are read as a set)\n\n## Decision\n\n### The lens\n\n#### Given\n\na planner has produced an overview and detail sources for an oversized diagram.\nA plausible plan can still lose a node, an edge, a row or a marker\n\n#### We prefer\n\nderiving the expected membership and facts from the original graph apart from the producer's reductions, over trusting the planner's own bookkeeping.\nEvery emitted source is also reparsed with Mermaid's parsers, and declared loss is recounted\n\n#### Because\n\nthe official parsers are the authority on what emitted text says, and a check that reuses the producer's reasoning repeats the producer's mistakes\n\n#### Unless\n\nno candidate ladder passes, when no plan is offered and the finding gives the refusal reason and any contract violations\n\n## Consequences\n\n### Pros\n\n- An offered plan never loses a node or relationship across its overview and details.\n- Declared loss, such as new reachable pairs or dropped rows, is a recount, not a claim.\n\n### Cons\n\n- Planning an oversized diagram parses Mermaid again for every emitted source, which slows the complexity policy.\n- Every new label or stub form must be taught to the verifier as well as the producer.\n"},"SLOP-0033":{"file":"0033-a-split-plan-follows-the-authors-structure.md","status":"accepted","title":"A split plan folds the author's own structure first and refuses what it cannot draw faithfully","markdown":"<!-- GENERATED from SLOP-0033 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Tested by [SLOP-0032](0032-a-split-plan-is-verified-independently-and-by-reparse.md) (the contract refuses a plan that moves a marker, hides a region or merges an edge)\n- See also [SLOP-0034](0034-a-refused-plan-offers-the-list-or-matrix-that-reads-better.md) (a diagram with no structure to fold gets a list or matrix)\n- See also [SLOP-0035](0035-a-plan-makes-the-fewest-folds-and-says-why-it-was-flagged.md) (how far a plan folds once it follows the author's structure)\n- See also [SLOP-0036](0036-author-families-keep-groups-apart.md) (label families are the author's grouping too)\n\n## Decision\n\n### The lens\n\n#### Given\n\nan oversized diagram can be folded many ways, and some folds say something the original does not\n\n#### We prefer\n\nfolding the author's own structure first and whole, over folding by graph communities alone.\nThat structure means subgraphs, a decision with its region up to where its branches rejoin, and an erDiagram aggregate under its identifying root.\nEchoing regions fold to the same depth, and twin chains fold as one group\n\n#### Because\n\na reader trusts the author's boundaries first.\nA structure folded whole keeps a decision's branches, a composite's markers and an aggregate's ownership together without inventing a path\n\n#### Unless\n\nthe structure cannot be drawn faithfully, as with sequence diagrams whose graph drops message order or composites with concurrent regions, which get no plan\n\n## Consequences\n\n### Pros\n\n- A diagram with subgraphs is split along them, as its author would split it.\n- Decision-heavy flows fold into named checks without adding reachable pairs.\n\n### Cons\n\n- Sequence diagrams and concurrent state diagrams never get a split plan.\n- An author region holding most of a diagram makes an overview dominated by one group, its detail split again.\n- Recursion stops at two levels, so a very large region may get no plan.\n"},"SLOP-0034":{"file":"0034-a-refused-plan-offers-the-list-or-matrix-that-reads-better.md","status":"accepted","title":"A dense mesh or an unsorted star gets no plan, and the finding offers the matrix or list that reads better","markdown":"<!-- GENERATED from SLOP-0034 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0031](0031-mermaid-policies-report-and-never-edit-a-diagram.md) (where no plan fits, the finding carries a list or matrix instead)\n- See also [SLOP-0033](0033-a-split-plan-follows-the-authors-structure.md) (a diagram with no structure to fold gets a list or matrix)\n\n## Decision\n\n### The lens\n\n#### Given\n\nsome diagrams cannot be summarised by folding.\nOne is a mesh joining at least half of its node pairs, with nodes averaging more than four links.\nAnother is a star whose leaves nothing but alphabet sorts\n\n#### We prefer\n\nrefusing a plan for a dense mesh or for alphabetical buckets, over offering a fold that still reads as either.\nA dense mesh is refused before planning, and so is any overview that is one.\nBuckets means every group is an alphabetical run of one star's sibling leaves.\nThe refusal prints a Markdown adjacency matrix or list built from the complete original graph\n\n#### Because\n\nfolding a mesh leaves a mesh, since its groups join each other too.\nA bucket by range gives a reader nothing to find.\nA matrix or list tells the diagram's whole story in reading order\n\n#### Unless\n\nthe diagram has structure a plan can fold, when the plan is offered instead\n\n## Consequences\n\n### Pros\n\n- A refused finding still gives the reader a complete, readable replacement for the diagram.\n- No plan is offered that does not make the diagram easier to read.\n\n### Cons\n\n- A star or mesh refusal prints a long list or a wide table in the diagnostic.\n- The list and matrix show labels as plain text, so markup inside a label appears literally.\n- A dense diagram that an author might still want folded gets no plan.\n"},"SLOP-0035":{"file":"0035-a-plan-makes-the-fewest-folds-and-says-why-it-was-flagged.md","status":"accepted","title":"A split plan makes the fewest folds that meet its target, keeps groups even, and says why it was flagged","markdown":"<!-- GENERATED from SLOP-0035 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0030](0030-the-score-counts-what-a-reader-must-read.md) (a plan's overview and details are measured by this score)\n- See also [SLOP-0033](0033-a-split-plan-follows-the-authors-structure.md) (how far a plan folds once it follows the author's structure)\n\n## Decision\n\n### The lens\n\n#### Given\n\na plan can fold more than its node and score targets ask, hiding names for no reason a reader can see.\nIt can also fold so little that one group holds most of the diagram\n\n#### We prefer\n\nthe fewest changes that meet the target, over the smallest overview the folds can reach.\nA diagram that fits with its attribute rows dropped folds only its closed aggregates.\nAn overview walked below 60 percent of node_target gives back a group.\nEvery plan states the size it was flagged at, its target and which measure is over\n\n#### Because\n\nevery fold hides a name or makes pairs reachable, so a fold the target did not ask for is pure loss.\nGroups of even size read as parts of one story.\nThe flagged text tells the reader when rows alone are the problem\n\n#### Unless\n\na tangled erDiagram, whose independent cycles reach a quarter of its nodes, keeps folding its aggregates evenly past the target.\nA tree-like overview reads as it is, and a tangled one does not\n\n## Consequences\n\n### Pros\n\n- A schema over its target only for its rows keeps every entity's name in view.\n- The reader sees why a diagram within its node target was flagged at all.\n\n### Cons\n\n- A plan near node_target can keep more nodes in its overview than a smaller fold would.\n- The 60 percent floor and the tangled threshold are judgements, not measured values.\n"},"SLOP-0036":{"file":"0036-author-families-keep-groups-apart.md","status":"accepted","title":"Label families the author wrote keep a suggested group to one family under the strict rules","markdown":"<!-- GENERATED from SLOP-0036 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- See also [SLOP-0033](0033-a-split-plan-follows-the-authors-structure.md) (label families are the author's grouping too)\n- See also [SLOP-0037](0037-a-group-is-named-by-what-it-holds.md) (a group holding a whole dotted family is named by it)\n\n## Decision\n\n### The lens\n\n#### Given\n\nlabels often carry the author's grouping, while modularity alone happily mixes them.\nIt shows as a dotted prefix such as gold., an id prefix such as PLAT- or br_, or a status word shared by id-led labels\n\n#### We prefer\n\nkeeping every community-based group to one family under the strict rules, over grouping by modularity gain alone.\nEach id family is offered whole first.\nFamilies mix only on a later, looser walk when the target cannot otherwise be met\n\n#### Because\n\nticket keys, table namespaces and pipeline stages are the author's own grouping, so a group mixing two reads as wrong whatever its modularity\n\n#### Unless\n\nthe diagram meets its target only with families mixed, when the looser rule sets run in order\n\n## Consequences\n\n### Pros\n\n- Ticket graphs and data pipelines fold one family or stage per group.\n- Mixing families is a visible last resort rather than an accident of ranking.\n\n### Cons\n\n- A family read from an id prefix or a stem can be wrong, and under the strict rules it forbids a merge.\n- Diagrams that need mixed families are walked more than once, which costs time.\n"},"SLOP-0037":{"file":"0037-a-group-is-named-by-what-it-holds.md","status":"accepted","title":"A split plan names each group by what it holds, never by one arbitrary member","markdown":"<!-- GENERATED from SLOP-0037 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Tested by [SLOP-0032](0032-a-split-plan-is-verified-independently-and-by-reparse.md) (every group label is accepted only as recomputed from its members)\n- See also [SLOP-0036](0036-author-families-keep-groups-apart.md) (a group holding a whole dotted family is named by it)\n- See also [SLOP-0038](0038-a-stub-names-exactly-one-thing-and-draws-each-edge-once.md) (a stub finds its group by the label the overview shows)\n\n## Decision\n\n### The lens\n\n#### Given\n\na group's name is the first thing a reader reads of it, and is read as a promise about every member.\nA name taken from one member promises only that member\n\n#### We prefer\n\nnaming a group by what all its members share, over one member's label and a count.\nFirst comes an author region's label, then a decision's question.\nA whole dotted family follows as gold.*, then twin lanes by their stages as Extract \u2192 bronze.\nNext come a range of interchangeable members, the node a set of leaves hangs from, and a flow's entry and exit.\nThen comes every member of a small group, as ROOM (+BUILDING), and only then the member a reader enters at\n\n#### Because\n\na name built from what every member shares promises nothing a member lacks, and a reader enters a chain where it starts\n\n#### Unless\n\nno shared name fits, because a label holds markup, a range would span another group's member, or the label passes 40 characters.\nThe group then keeps its entry member's label and a count\n\n## Consequences\n\n### Pros\n\n- Overviews read as the diagram's own stages, families and regions.\n- A label can never claim a member the group does not hold, because the verifier recomputes it.\n\n### Cons\n\n- Shared names are longer than a member label and a count, so the overview gives them more room.\n- The producer and the verifier each carry every label form, which grows with each new form.\n- Echoing regions with one label need a qualified name, which is longer still.\n"},"SLOP-0038":{"file":"0038-a-stub-names-exactly-one-thing-and-draws-each-edge-once.md","status":"accepted","title":"A detail's stub text has exactly one reading, and each edge it stands for is drawn once","markdown":"<!-- GENERATED from SLOP-0038 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Tested by [SLOP-0032](0032-a-split-plan-is-verified-independently-and-by-reparse.md) (stub texts must have one reading, and half edges are read as a set)\n- See also [SLOP-0037](0037-a-group-is-named-by-what-it-holds.md) (a stub finds its group by the label the overview shows)\n\n## Decision\n\n### The lens\n\n#### Given\n\na reader of a detail reads each stub as one outside thing and finds it in the overview by its text.\nEach line reads as one relationship\n\n#### We prefer\n\nstub text with exactly one reading, over stubs that repeat a group's label or draw one relationship several times.\nA member reads as PAYMENT_METHOD (in CUSTOMER (+2)), or by its own label where the group's label already names it.\nIn a flowchart detail, stubs for one group's members sit inside one box.\nEach edge from a whole group into a member is drawn once\n\n#### Because\n\ntwo stubs with one text read as a duplicate, and three lines from one stub read as three sources.\nA bare bracket leaves the reader to guess which group is meant\n\n#### Unless\n\na box would push a detail over its target or the diagram is not a flowchart.\nThe stubs are then drawn unboxed with their bracketed group\n\n## Consequences\n\n### Pros\n\n- Every stub can be found in the overview by its exact text.\n- Details carry fewer stubs and no duplicated relationships.\n\n### Cons\n\n- A stub's text grows by its group's label and count.\n- A target detail shows only that the source group leads to a member, not how many of its members do.\n- A box adds a subgraph, which weighs on a detail's score.\n"},"SLOP-0039":{"file":"0039-plain-word-runs-and-min-items.md","status":"accepted","title":"A long plain-word run is a hidden list, and every run rule takes a minItems option","markdown":"<!-- GENERATED from SLOP-0039 by okf_render.py. Do not edit; edit the .yml and regenerate. -->\n\n## Relates to\n\n- Extends [SLOP-0021](0021-comma-run-of-code-spans-is-a-hidden-list.md) (plain-word series get their own rule, and minItems tunes the code-run threshold too)\n- See also [SLOP-0006](0006-configuration-is-remark-plugin-options.md) (minItems is set like any other rule option)\n\n## Decision\n\n### The lens\n\n#### Given\n\na short plain-word series is ordinary English, while a long one is almost always a list\n\n#### We prefer\n\na plain-word run rule that reports from five items by default, over a fixed threshold shared by all run rules.\nEvery run rule also takes a minItems option\n\n#### Because\n\nlength is what tells a list from a series, and where that line sits is each project's call\n\n#### Unless\n\na project needs a different threshold per file, which plugin options alone cannot express\n\n## Consequences\n\n### Pros\n\n- A long list of service names or channels without backticks is reported.\n- A project can tune each run rule up or down without switching it off.\n\n### Cons\n\n- Without a colon lead-in the first item is never counted, so a run can be reported one item late.\n- Raising the flat interpunct rule's minItems hands shorter runs to punctuation-interpunct-in-prose, so list findings become glyph findings.\n"}}</script>
<script id="token-data" type="application/json">{"themes":{"light":{"bg":"#f7f7fa","panel":"#ffffff","ink":"#1b1d23","muted":"#5b6070","line":"#e2e4ea","accent":"#4f46e5","good":"#047857","bad":"#b91c1c","code":"#f1f2f6"},"dark":{"bg":"#0f1117","panel":"#171a23","ink":"#e6e8ef","muted":"#9aa0b0","line":"#2a2e3a","accent":"#a5b4fc","good":"#34d399","bad":"#f87171","code":"#1f2330"}}}</script>

<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const TOKENS = read("token-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // Both themes' values are written as CSS custom properties up front; the toggle
  // only flips which set is live.
  const themes = (TOKENS.themes) || {};
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    const t = themes[name];
    if (t) {
      for (const [k, v] of Object.entries(t)) {
        if (typeof v === "string") document.documentElement.style.setProperty("--" + k, v);
      }
    }
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one group. Presentation is decided here, and both channels are derived
  // rather than assigned: fill is the group, size is in-degree (how many records
  // refine or supersede this one). Status rides on the border, because usually only
  // a couple of records are superseded and a whole colour channel would be wasted.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-"))
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its group colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // A status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"], node[status = "retired"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: 'node[status = "proposed"]',
        style: { "border-width": 2, "border-color": css("muted"), "border-opacity": 1, "border-style": "dotted" },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // groups get dragged out of their own cluster, which collapses several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each group becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between group boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produces a long thin strip that fits to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // a browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  // A title is data, not markup: a record whose title contains "<" would
  // otherwise inject into the pane.
  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    // The record's markdown arrives without its frontmatter, because a renderer
    // would show that block as a heading. Its fields are the chips and the title
    // below, so nothing is lost.
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      "<h1>" + escapeHtml(rec.title) + "</h1>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped
    // to the rendered body: the chip above links to this record's own file and must keep
    // its native behaviour, or it would rewire into a no-op that reselects the current
    // record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per group. Clicking isolates that group; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the group. A cross-group edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // group boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the groups legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the
  // browser's back and forward buttons walk the reading history and a pasted link opens
  // its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
