id: SLOP-0008
slug: rule-id-is-subsystem-category-and-short-name
plan_id: null
title: A policy identifier is its subsystem, then a category word and a short name
description: Identifiers read subsystem/category-short-name, such as prose/sentence-one-per-line, never a number
status: accepted
accepted_on: 2026-10-25
last_changed_on: 2026-10-25
tags: [rules, naming, layout]

enforced_in:
  - src/types.ts, where PolicyRuleId lists every identifier
  - src/rules.ts, which groups the identifiers into PROSE_RULES and MERMAID_RULES
  - src/remark/plugin.ts, which derives configuration and suppression names from the part after the slash
  - RULES.md, whose policy table lists every full identifier

relates_to:
  - relation: extends
    target: SLOP-0009
    note: a policy file is named by the short name after the slash
  - relation: depended_on_by
    target: SLOP-0006
    note: configuration names a policy by its short name

decision:
  given: every finding, configuration key, suppression comment, heading and test names a policy
  we_prefer: an identifier of the subsystem, a slash, one category word and a short name joined by hyphens, over a sequential number
  because: the identifier then says which subsystem owns the policy and what it guards before anyone looks it up
  unless: a new policy fits no existing category, which calls for a new category word rather than a catch-all

consequences:
  pros:
    - A finding line explains itself.
    - Short names sort by category in a directory listing and in RULES.md.
  cons:
    - Identifiers are long in messages, tables and suppression comments.
    - Short names must stay unique across subsystems, because configuration drops the subsystem.
