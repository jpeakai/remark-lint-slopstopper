id: SLOP-0003
slug: shared-document-context-per-round
plan_id: null
title: Whole-document data is derived once per round on a shared DocumentContext
description: Every enabled policy in a reporting round reads one DocumentContext, so derived data is computed once and agrees
status: accepted
accepted_on: 2026-10-25
last_changed_on: 2026-10-25
tags: [architecture, rules]

enforced_in:
  - src/remark/plugin.ts, whose reporter builds one DocumentContext per round and passes it to every configured policy
  - src/document/context.ts, where projections and language views are memoised in context-local WeakMaps
  - src/prose/analyze.ts, which hands the same context to every enabled prose rule

relates_to:
  - relation: depends_on
    target: SLOP-0002
    note: the context wraps the host tree of the round
  - relation: extended_by
    target: SLOP-0004
    note: language analysis is the costliest data the context shares
  - relation: see_also
    target: SLOP-0010
    note: the context says what a rule is handed, and that record says where code reading it lives

decision:
  given: several policies need data derived from the whole document or from the same node, such as projections, sentences or interpunct runs
  we_prefer: deriving that data at most once per reporting round on a DocumentContext every policy receives, over each policy computing what it needs
  because: shared data makes the agreement between policies structural, and a fix round starts from a fresh context so no stale result survives an edit
  unless: the data is local to one policy, which keeps it inside that policy's module

consequences:
  pros:
    - Three prose policies reading one paragraph share one projection and one sentence analysis.
    - A policy module reads as context in, diagnostics out.
  cons:
    - Each fix round rebuilds the context, so derived data is recomputed after every applied edit.
    - Anything added to the context becomes a contract every policy and direct caller of createDocument can rely on.
