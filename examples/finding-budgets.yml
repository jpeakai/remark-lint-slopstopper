# The most diagram findings each comparison may report, with the reason.
# Every finding a comparison reports must fall under an entry here; fewer is
# fine, so a resolved limitation needs no edit. Budgets bound regression
# tests only: the plugin still reports every finding as an error.
#
# surface is the text before the finding's first colon, or "unauditable" for
# a surface the policy cannot measure. theme applies to measured surfaces.

13-architecture--checkout-infrastructure--architecture-groups-services:
  - rule: mermaid/contrast-connectors-below-minimum
    surface: unauditable
    max: 1
    reason: architecture connectors are not modelled by the connector policy

